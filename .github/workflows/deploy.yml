name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Local deploy.sh (RECOMMENDED)
        run: |
          echo ""
          echo "================================================"
          echo "  Cladly VPS Deployment - Local Approach"
          echo "================================================"
          echo ""
          echo "📋 This workflow now recommends the LOCAL deploy.sh approach:"
          echo ""
          echo "   ./deploy.sh VPS_IP -k /path/to/private/key"
          echo "   # OR with password:"
          echo "   ./deploy.sh VPS_IP VPS_PASSWORD"
          echo ""
          echo "✅ WHY THIS WORKS:"
          echo "  - Runs SSH/dnf/caddy on YOUR machine (you have root/sudo)"
          echo "  - NO VPS network connectivity required"
          echo "  - Works on any VPS (Oracle Cloud, Arch/Linux, any distro)"
          echo "  - Bypasses all VPS environment constraints:"
          echo "    - drone-ssh binary download blocked by firewalls"
          echo "    - opc user without sudo privileges"
          echo "    - Docker Compose not installed on VPS"
          echo "    - Package manager mismatches (dnf vs pacman vs apt)"
          echo "    - Caddy installation requiring root"
          echo ""
          echo "📋 GitHub Secrets (for reference - used by local deploy.sh):"
          echo "  VPS_HOST: your VPS IP"
          echo "  VPS_SSH_KEY: full private key (BEGIN to END inclusive)"
          echo "  VPS_USERNAME: opc"
          echo "  SECRET_KEY, DATABASE_URL, CLOUDINARY_*, RAZORPAY_*, email vars"
          echo ""
          echo "📋 Local deploy.sh usage:"
          echo "  ./deploy.sh VPS_IP -k /path/to/private/key"
          echo "   # OR with password:"
          echo "   ./deploy.sh VPS_IP VPS_PASSWORD"
          echo ""
          echo "📋 GitHub repo: https://github.com/CladlyOD/cladly"