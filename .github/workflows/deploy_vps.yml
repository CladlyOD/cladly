name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Local deploy.sh
        run: |
          echo "📦 Running local deploy.sh approach..."
          echo "🔑 This uses your local machine's SSH key and docker"
          echo "📍 Make sure you have:"
          echo "   - VPS_HOST, VPS_SSH_KEY secrets set in GitHub"
          echo "   - deploy.sh in the repo root"
          echo "   - .env.deploy file locally (not committed)"
          echo ""
          echo "📋 Run on your local machine:"
          echo "   ./deploy.sh VPS_IP -k /path/to/private/key"
          echo "   # OR with password: ./deploy.sh VPS_IP VPS_PASSWORD"
          echo ""
          echo "✅ This approach works because it runs on your machine"
          echo "   (where you have root/sudo), not on the VPS"
          echo ""
          echo "📊 GitHub Actions historically fails on VPS due to:"
          echo "   - drone-ssh binary download blocked by firewalls"
          echo "   - opc user without sudo privileges"
          echo "   - Docker Compose not installed on VPS"
          echo "   - Package manager mismatches (dnf vs apt vs pacman)"
          echo "   - Caddy installation requiring root"
          echo ""
          echo "🔗 See: https://github.com/CladlyOD/cladly/blob/main/deploy.sh"
