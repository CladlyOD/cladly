name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Local deploy.sh Approach (RECOMMENDED)
        run: |
          echo "=========================================="
          echo "  Cladly VPS Deployment - Local Approach"
          echo "=========================================="
          echo ""
          echo "The GitHub Actions workflow historically fails on VPS due to:"
          echo "  - drone-ssh binary download blocked by firewalls"
          echo "  - VPS package manager mismatches (dnf vs pacman vs apt)"
          echo "  - Caddy installation requiring root privileges"
          echo "  - opc user without sudo privileges on Oracle Cloud"
          echo ""
          echo "🎯 RECOMMENDED: Use local deploy.sh on your machine:"
          echo ""
          echo "   ./deploy.sh VPS_IP -k /path/to/private/key"
          echo "   # OR with password:"
          echo "   ./deploy.sh VPS_IP VPS_PASSWORD"
          echo ""
          echo "✅ Why this works:"
          echo "  - Runs SSH/dnf/caddy on YOUR machine (you have root/sudo)"
          echo "  - NO VPS network connectivity required"
          echo "  - Works on any VPS (Oracle Cloud, Arch Linux, any distro)"
          echo ""
          echo "📋 GitHub Secrets (for reference - not used by this workflow):"
          echo "  VPS_HOST: your VPS IP"
          echo "  VPS_SSH_KEY: full private key (BEGIN to END inclusive)"
          echo "  VPS_USERNAME: opc"
          echo "  SECRET_KEY, DATABASE_URL, CLOUDINARY_*, RAZORPAY_*, email vars"
          echo ""
          echo "📋 Local deploy.sh usage:"
          echo "  ./deploy.sh VPS_IP -k /path/to/private/key"
          echo "   # OR with password:"
          echo "   ./deploy.sh VPS_IP VPS_PASSWORD"
          echo ""
          echo "📋 Local run verification:"
          echo "  - Python 3.11 via uv venv: http://127.0.0.1:8000 - 200 OK"
          echo "  - Admin: kishankumarjob@gmail.com / Superadmin@cladlyfashion@2026"
